<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorthIt · 消费投资看板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6B4F'/%3E%3Cpath d='M8 21 L14 13 L19 17 L25 8' stroke='%23E5B95C' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='8' r='2.6' fill='%23E5B95C'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F5F6F2; --card:#FFFFFF; --ink:#1E2A23; --sub:#6B7A70; --line:#E3E7E0;
  --brand:#2F6B4F; --brand-soft:#E5EFE8; --gold:#B98A2F; --gold-soft:#F7EFDC;
  --warn:#C0552E; --warn-soft:#F9E9E1; --info:#3E6B8E; --info-soft:#E7EFF4;
  --radius:12px; --shadow:0 1px 2px rgba(30,42,35,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",-apple-system,sans-serif;font-size:14px;line-height:1.55}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D5DBD2;border-radius:4px}

/* ===== 顶栏 ===== */
header{position:sticky;top:0;z-index:50;background:rgba(245,246,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:.02em}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.brand .logo svg{width:18px;height:18px}
.brand small{font-weight:400;color:var(--sub);font-size:11px;letter-spacing:.08em}
.tabs{margin-left:auto;display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto}
.tabs button{padding:6px 14px;border-radius:8px;color:var(--sub);white-space:nowrap}
.tabs button.on{background:var(--brand);color:#fff;font-weight:600}

main{max-width:1120px;margin:0 auto;padding:18px 16px 80px}
.section-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
.section-title h2{font-size:17px;font-weight:700}
.section-title .note{color:var(--sub);font-size:12px}
.hidden{display:none!important}

/* ===== 汇总卡 ===== */
.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sum-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sum-card .label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.sum-card .value{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.sum-card .sub{font-size:11px;color:var(--sub);margin-top:3px}
.sum-card .bar{position:absolute;left:0;right:0;bottom:0;height:3px}
.sum-card.green .bar{background:var(--brand)}
.sum-card.gold .bar{background:var(--gold)}
.sum-card.warn .bar{background:var(--warn)}
.sum-card.info .bar{background:var(--info)}

/* ===== 提醒 ===== */
.alert-strip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alert-strip .empty{color:var(--sub);font-size:13px}
.alert-tag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid transparent}
.alert-tag .dot{width:6px;height:6px;border-radius:50%;flex:none}
.alert-tag.soon{background:var(--gold-soft);color:#8A6416;border-color:#EAD9AC}
.alert-tag.soon .dot{background:var(--gold)}
.alert-tag.over{background:var(--warn-soft);color:#9A4222;border-color:#F0CEBC}
.alert-tag.over .dot{background:var(--warn)}

/* ===== 看板主体两栏 ===== */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.panel h3 .more{font-size:12px;color:var(--brand);font-weight:500;cursor:pointer}
.chart-box{width:100%;height:250px}
.rank-list{display:flex;flex-direction:column;gap:9px}
.rank-note{font-size:11px;color:var(--sub);margin:-4px 0 8px}
.rank-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.rank-item .idx{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rank-item:nth-child(1) .idx{background:var(--gold-soft);color:#8A6416}
.rank-item .info{min-width:0}
.rank-item .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-item .meta{font-size:11px;color:var(--sub)}
.rank-item .val{text-align:right}
.rank-item .val b{font-size:14px}
.rank-item .val span{display:block;font-size:11px;color:var(--sub)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--info-soft);color:var(--info)}
.tag.retired{background:#EFEFEA;color:#8A8F88}

/* ===== 物品列表 ===== */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--sub)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn{padding:8px 14px;border-radius:8px;background:var(--brand);color:#fff;font-weight:600;font-size:13px}
.btn.ghost{background:var(--card);color:var(--brand);border:1px solid var(--brand)}
.btn.danger{background:var(--warn)}
.item-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.item-table th,.item-table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.item-table th{background:#FAFBF8;color:var(--sub);font-size:12px;font-weight:600}
.item-table tbody tr{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item-table tbody tr:hover{background:#FAFCF9}
.item-table td.nm{font-weight:600}
.mini-bar{width:110px;height:6px;border-radius:3px;background:#EEF1EB;overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.mini-bar i.gold{background:var(--gold)}
.mini-bar i.warn{background:var(--warn)}

/* ===== 物品图片 ===== */
.itm{display:flex;align-items:center;gap:9px;min-width:0}
.itm .nm2{min-width:0}
.thumb{width:34px;height:34px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;background-size:cover;background-position:center;overflow:hidden}
.img-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.img-preview{width:92px;height:92px;border-radius:16px;background:var(--brand-soft);border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--brand);cursor:pointer;background-size:cover;background-position:center;overflow:hidden;flex:none}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.img-actions .hint{font-size:11px;color:var(--sub)}

/* ===== 视图切换 / 方块视图 ===== */
.sort-select{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:12px;color:var(--ink);cursor:pointer;max-width:150px}
.view-switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.view-switch button{padding:6px 10px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.view-switch button.on{background:var(--brand);color:#fff}
.view-switch svg{width:15px;height:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.card .pic{aspect-ratio:1/1;height:auto;width:100%;background:var(--brand-soft);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:800;color:var(--brand);background-size:cover;background-position:center}
.card .body{padding:10px 12px 12px}
.card .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:11px;color:var(--sub);margin-top:2px}
.card .row2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.card .daily{font-size:16px;font-weight:700}
.card .daily small{font-size:11px;color:var(--sub);font-weight:400}
.card .tags{position:absolute;top:8px;left:8px;display:flex;gap:4px;flex-wrap:wrap}
.card .tags .alert-tag{padding:3px 7px;font-size:10px}
.card .check{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92)}

/* ===== 网状图视图 ===== */
.graph-box{width:100%;height:560px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.link-tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;background:var(--info-soft);color:var(--info);margin-left:6px}
.link-tag.tight{background:var(--gold-soft);color:#8A6416}
.link-row{display:flex;align-items:center;gap:8px;background:#FAFBF8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.link-row .del{color:var(--warn);font-size:12px;cursor:pointer;margin-left:auto}

/* ===== 多选 / 勾选 ===== */
.check{width:22px;height:22px;border-radius:50%;border:2px solid #C9D2C6;background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.check.on{background:var(--brand);border-color:var(--brand)}
.check.on::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.batch-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1E2A23;color:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:14px;z-index:80;box-shadow:0 6px 24px rgba(30,42,35,.25)}
.batch-bar .cnt{font-size:13px;white-space:nowrap}
.batch-bar .cnt b{font-size:15px}
.batch-bar button{color:#E5B95C;font-size:13px;font-weight:600;white-space:nowrap}
.batch-bar button.danger{color:#F2B8A0}

/* ===== 右键 / 长按菜单 ===== */
.ctx-menu{position:fixed;z-index:90;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(30,42,35,.18);padding:6px;min-width:124px}
.ctx-menu button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:7px;font-size:13px}
.ctx-menu button:hover{background:var(--brand-soft);color:var(--brand)}
.ctx-menu button.danger{color:var(--warn)}
.ctx-menu button.danger:hover{background:var(--warn-soft)}

/* ===== 详情页 ===== */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;margin-bottom:14px;cursor:pointer}
.detail-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail-head h1{font-size:22px;font-weight:800}
.detail-head .cats{margin-left:auto;display:flex;gap:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;color:var(--sub)}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--sub)}
.dep-bar{height:12px;border-radius:6px;background:#EEF1EB;position:relative;overflow:hidden}
.dep-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),var(--gold))}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.field textarea{min-height:56px;resize:vertical}
.extras-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.extra-row{display:grid;grid-template-columns:1fr 90px 80px auto;gap:8px;align-items:center;background:#FAFBF8;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.extra-row .del{color:var(--warn);font-size:12px;cursor:pointer}
.status-box{border:1px dashed var(--line);border-radius:var(--radius);padding:14px;margin-top:14px}
.status-box .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.status-box .field{flex:1;min-width:130px}

/* ===== 数据页 ===== */
.data-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.data-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.data-card h3{font-size:15px;font-weight:700;margin-bottom:6px}
.data-card p{font-size:12px;color:var(--sub);margin-bottom:12px}
.data-card .btns{display:flex;gap:8px;flex-wrap:wrap}
.formula{background:#FAFBF8;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;font-size:13px;color:#3E4A42}
.formula h3{font-size:14px;font-weight:700;margin-bottom:8px}
.formula li{margin:6px 0 6px 18px}
.formula code{background:var(--brand-soft);padding:1px 6px;border-radius:4px;font-size:12px;color:var(--brand)}

/* ===== toast ===== */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(80px);background:#1E2A23;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:#9AA39B;font-size:11px;text-align:center}

/* ===== 移动端 ===== */
@media (max-width:760px){
  .summary-grid{grid-template-columns:repeat(2,1fr)}
  .summary-grid .sum-card:last-child{grid-column:1/-1}
  .dash-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid{grid-template-columns:1fr}
  .item-table th:nth-child(4),.item-table td:nth-child(4),
  .item-table th:nth-child(6),.item-table td:nth-child(6){display:none}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .sort-select{max-width:118px}
  .graph-box{height:460px}
  main{padding-bottom:110px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<header>
  <div class="nav">
    <a class="brand" href="#/dashboard">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 17 L10 9 L14 13 L20 5" stroke="#E5B95C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="5" r="2.2" fill="#E5B95C"/></svg></span>
      消费投资账<small>WORTH IT</small>
    </a>
    <div class="tabs" id="tabs">

<main id="main">

  <!-- ===== 视图：看板 ===== -->

  <!-- ===== 视图：数据 ===== -->

</main>

<div id="toast"></div>

  <button data-action="ctx-edit">编辑物品</button>
  <button class="danger" data-action="ctx-delete">删除物品</button>
</div>
<footer>示例数据仅作演示 · 数据仅保存在本机浏览器，可随时导出备份</footer>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
'use strict';
/* ============================================================
 * ROI · 消费投资看板
 * 口径说明：
 * 摊薄法（日均持有成本）= (买入价+附加成本-回血) ÷ 持有天数
 * 折旧法（双倍余额递减）= 残值 = max(买入价×残值率, 买入价×(1-2÷寿命)^持有年数)，先快后缓
 * ============================================================ */
var LS_KEY='worthit-db-v1';
var LS_LEGACY='roi-db-v1';
var IDB_NAME='worthit-images';var IDB_VER=2;var IDB_STORE='images';
var _idbPromise=null;
function idb(){if(_idbPromise)return _idbPromise;
  _idbPromise=new Promise(function(res,rej){if(!window.indexedDB){rej(new Error('no-idb'));return;}
    var rq=indexedDB.open(IDB_NAME,IDB_VER);
    rq.onupgradeneeded=function(){var db=rq.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains('data'))db.createObjectStore('data');};
    rq.onsuccess=function(){res(rq.result);};
    rq.onerror=function(){rej(rq.error);};});
  return _idbPromise;}
function imgSave(key,dataURL){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(dataURL,key);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}).catch(function(e){toast('图片存储不可用（本环境限制），图片未保存');throw e;});}
function imgLoad(key){if(!key)return Promise.resolve(null);return idb().then(function(db){return new Promise(function(res){var tx=db.transaction(IDB_STORE,'readonly');var rq=tx.objectStore(IDB_STORE).get(key);rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){res(null);};});}).catch(function(){return null;});}
function imgDel(key){if(!key)return Promise.resolve();return idb().then(function(db){return new Promise(function(res){var tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(key);tx.oncomplete=res;tx.onerror=res;});}).catch(function(){});}
function idbDataPut(key,val){return idb().then(function(db){return new Promise(function(res,rej){var tx=db.transaction('data','readwrite');tx.objectStore('data').put(val,key);tx.oncomplete=res;tx.onerror=function(){rej(tx.error);};});}).catch(function(){});}
function idbDataGet(key){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction('data','readonly');var rq=tx.objectStore('data').get(key);rq.onsuccess=function(){res(rq.result||null);};rq.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbDataDel(key){return idb().then(function(db){return new Promise(function(res){var tx=db.transaction('data','readwrite');tx.objectStore('data').delete(key);tx.oncomplete=res;tx.onerror=res;});}).catch(function(){});}
function compressImage(file,maxSide){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width,h=img.height;var scale=Math.min(1,(maxSide||600)/Math.max(w,h));
      var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
      var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img-load'));};
    img.src=url;
  });
}
var CATS=['数码','家电','服饰','运动','美妆个护','家居','户外','收藏','书籍','其他'];

/* ---------- 工具 ---------- */
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDate(d){function p(n){return n<10?'0'+n:''+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function addMonths(d,n){return new Date(d.getFullYear(),d.getMonth()+n,d.getDate());}
function addYears(d,n){return new Date(d.getFullYear()+n,d.getMonth(),d.getDate());}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function uid(){return 'it'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function fmtMoney(n){if(!isFinite(n))return '—';return '¥'+Math.round(n).toLocaleString('zh-CN');}
function fmtMoney1(n){if(!isFinite(n))return '—';return '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:1,maximumFractionDigits:2});}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2200);}

/* ---------- 计算口径 ---------- */
function holdingDays(it){var end=it.status==='retired'&&it.retireDate?parseDate(it.retireDate):today();return Math.max(1,daysBetween(parseDate(it.purchaseDate),end));}
function totalExtras(it){return it.extras.reduce(function(s,e){return s+(+e.amount||0);},0);}
function totalCost(it){return (+it.purchasePrice||0)+totalExtras(it);}
function saleProceeds(it){return (it.status==='retired'&&it.salePrice)?(+it.salePrice):0;}
function dailyCost(it){return (totalCost(it)-saleProceeds(it))/holdingDays(it);}
/* 使用频率 → 次均使用成本（估算口径） */
const FREQ_OPTS=[
  {v:'daily',label:'每天',perDay:1},
  {v:'w3',label:'每周 2-3 次',perDay:3/7},
  {v:'w1',label:'每周 1 次',perDay:1/7},
  {v:'m2',label:'每月 2-3 次',perDay:2.5/30},
  {v:'m1',label:'每月 1 次',perDay:1/30},
  {v:'rare',label:'几乎不用（每季度 ≤1 次）',perDay:1/90}
];
const FREQ_MAP={};FREQ_OPTS.forEach(o=>FREQ_MAP[o.v]=o);
function freqLabel(v){return v&&FREQ_MAP[v]?FREQ_MAP[v].label:'—';}
function totalUses(it){const d=holdingDays(it),p=(FREQ_MAP[it.frequency]||{}).perDay||0;return d*p>0?Math.max(1,d*p):0;}
function perUseCost(it){const u=totalUses(it);return u>0?(totalCost(it)-saleProceeds(it))/u:null;}
function annualDep(it){var p=+it.purchasePrice||0;return p*2/(+it.lifespanYears||1);}
function residualValue(it){var p=+it.purchasePrice||0;var yrs=daysBetween(parseDate(it.purchaseDate),today())/365;var floor=p*(+it.salvageRate||0);return Math.max(floor,p*Math.pow(1-2/(+it.lifespanYears||1),Math.max(0,yrs)));}
function depreciatedAmt(it){if(it.status==='retired'){return totalCost(it)-saleProceeds(it);}return (+it.purchasePrice||0)-residualValue(it);}
function depProgress(it){var p=+it.purchasePrice||0;return p?Math.min(1,Math.max(0,depreciatedAmt(it)/p)):0;}
function lifeEnd(it){return addYears(parseDate(it.purchaseDate),+it.lifespanYears||1);}
function warrantyEnd(it){return addMonths(parseDate(it.purchaseDate),+it.warrantyMonths||0);}
function alertsOf(it){var arr=[];if(it.status!=='active')return arr;
  var end=lifeEnd(it);var remain=daysBetween(today(),end);
  if(remain<0){arr.push({type:'life',level:'over',text:'已超预期寿命 '+Math.abs(remain)+' 天',id:it.id});}
  else if(remain<=90){arr.push({type:'life',level:'soon',text:'预计 '+remain+' 天后退役',id:it.id});}
  if(it.warrantyMonths>0){var we=warrantyEnd(it);var wr=daysBetween(today(),we);
    if(wr<0){arr.push({type:'warranty',level:'over',text:'保修已过期 '+Math.abs(wr)+' 天',id:it.id});}
    else if(wr<=30){arr.push({type:'warranty',level:'soon',text:'保修 '+wr+' 天后到期',id:it.id});}}
  return arr;}
function residualTimeline(it){var pts=[];var start=parseDate(it.purchaseDate);var years=+it.lifespanYears||1;var end=addYears(start,years);
  var p=+it.purchasePrice||0;var floor=p*(+it.salvageRate||0);var r=2/years;
  var months=Math.max(1,Math.round((end-start)/86400000/30.44));
  for(var i=0;i<=months;i++){var d=new Date(start.getFullYear(),start.getMonth()+i,start.getDate());var v=Math.max(floor,Math.round(p*Math.pow(1-r,i/12)));pts.push([fmtDate(d),v]);}
  return pts;}

function sortList(list){
  if(!STATE.sort||STATE.sort==='default')return list;
  const parts=STATE.sort.split('-');const key=parts[0],dir=parts[1];
  let f;
  if(key==='date')f=(a,b)=>parseDate(a.purchaseDate)-parseDate(b.purchaseDate);
  else if(key==='daily')f=(a,b)=>dailyCost(a)-dailyCost(b);
  else if(key==='hold')f=(a,b)=>holdingDays(a)-holdingDays(b);
  else if(key==='cost')f=(a,b)=>totalCost(a)-totalCost(b);
  else if(key==='name')f=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'zh');
  if(!f)return list;
  return list.slice().sort((a,b)=>dir==='desc'?f(b,a):f(a,b));
}

/* ---------- 网状图 ---------- */
const CAT_COLORS={'数码':'#2F6B4F','家电':'#3E6B8E','服饰':'#B98A2F','运动':'#C0552E','美妆个护':'#8E7BA6','家居':'#7A8F6B','户外':'#5B8E8E','收藏':'#C98A5A','书籍':'#A6A27A','其他':'#9AA39B'};
function catColor(c){return CAT_COLORS[c]||'#9AA39B';}
/* 网状图配色：大类色相均匀分布（强对比），同大类子分类只调明暗饱和（相近） */
const CAT_HUES={'数码':144,'家电':216,'服饰':72,'运动':288,'美妆个护':252,'家居':108,'户外':180,'收藏':36,'书籍':324,'其他':0};
function nodeColor(it){
  const c=it.category||'其他';
  const h=CAT_HUES[c]!==undefined?CAT_HUES[c]:((c.charCodeAt(0)*37)%360);
  if(!it.sub)return 'hsl('+h+',62%,50%)';
  let k=0;const s=String(it.sub);for(let i=0;i<s.length;i++)k=(k*31+s.charCodeAt(i))%997;
  return 'hsl('+h+','+(52+(k%5)*5)+'%,'+(38+(k%7)*4)+'%)';
}
function nodeStyle(it){
  const c=nodeColor(it);const days=holdingDays(it);
  if(days<365)return {color:c,borderColor:'#fff',borderWidth:2};
  if(days<1095)return {color:hslAlpha(c,0.6),borderColor:'#fff',borderWidth:2};
  return {color:hslAlpha(c,0.28),borderColor:'rgba(47,75,66,0.5)',borderWidth:2.5,borderType:'dashed'};
}
function hslAlpha(hsl,a){return hsl.replace('hsl','hsla').replace(')',','+a+')');}
function computeGraphLayout(nodes,edges,W,H){
  const byId={};nodes.forEach(n=>byId[n.id]=n);
  const N=nodes.length;
  nodes.forEach(function(n,i){
    const a=i/N*Math.PI*2;
    n.x=W/2+Math.cos(a)*Math.min(W,H)*0.28;
    n.y=H/2+Math.sin(a)*Math.min(W,H)*0.28;
    n.vx=0;n.vy=0;
  });
  for(let iter=0;iter<90;iter++){
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=nodes[i],b=nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y;
      let d2=dx*dx+dy*dy;if(d2<4)d2=4;
      const d=Math.sqrt(d2);
      const f=1400/d2;
      const fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;
    }
    edges.forEach(function(e){
      const a=byId[e.source],b=byId[e.target];if(!a||!b)return;
      const ideal=e.value>=2?55:(e.value>=1?85:150);
      let dx=a.x-b.x,dy=a.y-b.y;
      const d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-ideal)*0.035;
      const fx=dx/d*f,fy=dy/d*f;
      a.vx-=fx;a.vy-=fy;b.vx+=fx;b.vy+=fy;
    });
    nodes.forEach(function(n){
      n.vx=(n.vx-n.x*0.006)*0.82;
      n.vy=(n.vy-n.y*0.006)*0.82;
      n.x+=n.vx;n.y+=n.vy;
    });
  }
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  nodes.forEach(function(n){if(n.x<minX)minX=n.x;if(n.x>maxX)maxX=n.x;if(n.y<minY)minY=n.y;if(n.y>maxY)maxY=n.y;});
  const pad=60,sx=(W-pad*2)/Math.max(maxX-minX,1),sy=(H-pad*2)/Math.max(maxY-minY,1),s=Math.min(sx,sy);
  return nodes.map(function(n){return {x:(n.x-(minX+maxX)/2)*s+W/2,y:(n.y-(minY+maxY)/2)*s+H/2};});
}
function renderGraphChart(list){
  const el=document.getElementById('graph-box');if(!el)return;
  if(STATE.charts.graph){STATE.charts.graph.dispose();delete STATE.charts.graph;}
  const ids=new Set(list.map(i=>i.id));
  const dmax=Math.max(0.001,...list.map(it=>dailyCost(it)));
  const nodes=list.map(it=>({
    id:it.id,name:it.name,category:it.category,
    symbolSize:Math.round(14+Math.sqrt(Math.max(0,dailyCost(it)))/Math.sqrt(dmax)*26),
    itemStyle:nodeStyle(it),
    label:{show:true,formatter:function(){return it.name;},fontSize:10,color:'#3E4A42',position:'bottom'},
    tooltip:{formatter:function(){return '<b>'+esc(it.name)+'</b><br/>'+esc(it.category)+(it.sub?' · '+esc(it.sub):'')+(it.status==='retired'?' · 已退役':'')+'<br/>日均 '+fmtMoney1(dailyCost(it))+'/天'+(perUseCost(it)!=null?'<br/>次均 ≈ '+fmtMoney1(perUseCost(it))+'/次':'')+'<br/>'+(it.status==='active'?'残值 '+fmtMoney(residualValue(it)):'回血 '+fmtMoney(saleProceeds(it)||0));}},
    value:[dailyCost(it),residualValue(it)]
  }));
  const edges=[];const seen=new Set();
  list.forEach(it=>(it.links||[]).forEach(l=>{
    if(!ids.has(l.id))return;
    const k=[it.id,l.id].sort().join('|');if(seen.has(k))return;seen.add(k);
    const w=+l.weight||1;
    edges.push({source:it.id,target:l.id,value:w,
      lineStyle:{width:w*2.4,color:w>=2?'#B98A2F':'#2F6B4F',curveness:0.08},symbol:'none'});
  }));
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      const a=list[i],b=list[j];
      if(a.category!==b.category)continue;
      const k=[a.id,b.id].sort().join('|');if(seen.has(k))continue;seen.add(k);
      edges.push({source:a.id,target:b.id,value:0.4,
        lineStyle:{width:1,color:'#C9D2C6',type:'dashed'},symbol:'none'});
    }
  }
  // 自写同步力导向布局（不依赖动画帧，任何环境即时渲染；同分类弱边引力→靠近，手动紧密关联引力更强→更近）
  const W=el.clientWidth||660,H=el.clientHeight||460;
  const pos=computeGraphLayout(nodes,edges,W,H);
  nodes.forEach(function(n,i){n.x=pos[i].x;n.y=pos[i].y;});
  if(!STATE.charts.graph)STATE.charts.graph=echarts.init(el);
  STATE.charts.graph.setOption({
    tooltip:{trigger:'item',triggerOn:'click',renderMode:'richText',confine:true},
    animation:false,
    series:[{
      type:'graph',layout:'none',roam:true,draggable:true,
      label:{show:true,fontSize:10},
      data:nodes,edges
    }]
  });
  STATE.charts.graph.off('click');
  STATE.charts.graph.on('click',function(p){
    if(p.dataType==='node'&&p.data&&p.data.id){location.hash='#/item?id='+p.data.id;}
  });
}

function renderResidualChart(it){
  const pts=residualTimeline(it);

  if(!STATE.charts.residual)STATE.charts.residual=echarts.init(document.getElementById('chart-residual'));

    tooltip:{trigger:'axis',triggerOn:'click',renderMode:'richText',confine:true,valueFormatter:v=>fmtMoney(v)},

}

        <button class="btn ghost" data-action="gh-pull">拉取云端 → 本机</button>
        <button class="btn ghost" data-action="gh-push">推送本机 → 云端</button>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin-top:10px;cursor:pointer"><input type="checkbox" id="gh-autopull" ${gc&&gc.autoPull?'checked':''} style="accent-color:var(--info)"> 打开页面时自动从云端拉取（会覆盖本机数据）</label>
      <div style="font-size:11px;color:var(--sub);margin-top:8px" id="gh-status">${gc?(gc.syncedAt?'上次同步：'+new Date(gc.syncedAt).toLocaleString('zh-CN'):'配置已保存，尚未同步'):'未配置'}</div>
      <div style="font-size:11px;color:var(--sub);margin-top:4px;line-height:1.5">Token 获取：GitHub → Settings → Developer settings → Personal access tokens → Generate（勾选该仓库 Contents 读写权限）。Token 仅保存在本机浏览器，请勿泄露；数据文件位于该仓库 <code>worthit-data.json</code>。</div>
    </div>

      <h3>数据文件绑定</h3>

      <div class="btns"><button class="btn" data-action="bind-file">选择数据文件并绑定</button><button class="btn ghost hidden" id="unbind-btn" data-action="unbind-file">解除绑定</button></div>
    </div>
    <div class="data-card"><h3>导出备份</h3><p>下载全部数据为 JSON 文件（含物品图片），可存到网盘或换设备时导入。</p><div class="btns"><button class="btn ghost" data-action="export-data">导出 JSON</button></div></div>
    <div class="data-card"><h3>导入数据</h3><p>选择之前导出的 JSON 文件（含图片），将<strong>替换</strong>当前全部数据。</p><div class="btns"><button class="btn ghost" data-action="import-data">选择文件导入</button><input type="file" id="import-file" accept=".json,application/json" class="hidden"></div></div>

      <li><b>摊薄法 · 日均持有成本</b>：<code>(购买价 + 附加成本 − 二手回血) ÷ 持有天数</code>，回答"这物件每天花了我多少钱"；在役物品持有天数截至今天，退役物品截至退役日。</li>
      <li><b>折旧法 · 双倍余额递减（先快后缓）</b>：当前残值 = <code>购买价 × (1 − 2 ÷ 预期寿命年) ^ 持有年数</code>，且不低于 <code>购买价 × 残值率</code>；残值趋势曲线即按此绘制（新物件贬值快、随时间趋缓）。"年折旧"显示第一年折旧额 <code>购买价 × 2 ÷ 预期寿命年</code>。</li>

      <li><b>已折旧</b>：在役物品按折旧法计算；已退役物品按 <code>总投入 − 回血</code>（钱已经花掉的）计入。</li>
      <li><b>提醒</b>：剩余寿命 ≤ 90 天或保修 ≤ 30 天 → 橙色"将到期"；已超过 → 红色"超期"。</li>
      <li>数据保存在浏览器 IndexedDB（并同步到 localStorage）；建议在「数据文件绑定」中绑定一个 JSON 文件自动写入，或用「GitHub 云同步」在手机与电脑间双向同步。</li>
    </ul>
  </div>`;
  idbDataGet('fileHandle').then(function(h){
    const el=document.getElementById('file-bound'),ub=document.getElementById('unbind-btn');
    if(h&&h.name){if(el)el.textContent='已绑定：'+h.name+'。每次修改自动写入该文件，请勿删除。';if(ub)ub.classList.remove('hidden');}
  });
}

/* ---------- 事件委托 ---------- */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-action]');
  const act=el?el.dataset.action:null;
  if(act==='ctx-edit'||act==='ctx-delete'){
    const id=STATE.ctxId;hideCtx();
    if(act==='ctx-edit'&&id){location.hash='#/item?id='+id;}
    if(act==='ctx-delete'&&id){deleteById(id);}
    return;
  }
  if(e.target.closest&&e.target.closest('#ctx-menu')){hideCtx();return;}
  if(Date.now()<STATE.suppressClick){return;}
  hideCtx();
  if(!el)return;
  if(act==='nav'){go(el.dataset.view);return;}
  if(act==='open-item'){if(STATE.batchMode){toggleSelect(el.dataset.id);}else{location.hash='#/item?id='+el.dataset.id;}return;}
  if(act==='back'){history.length>1?history.back():go('dashboard');return;}
  if(act==='add-item'){location.hash='#/item';return;}
  if(act==='toggle-view'){STATE.viewMode=el.dataset.mode;try{localStorage.setItem('worthit-view',STATE.viewMode);}catch(err){}renderItems();return;}
  if(act==='batch-mode'){STATE.batchMode=!STATE.batchMode;STATE.selected.clear();renderItems();return;}
  if(act==='toggle-select'){toggleSelect(el.dataset.id);return;}
  if(act==='select-all'){selectAllToggle();return;}
  if(act==='batch-delete'){batchDelete();return;}
  if(act==='chip'){STATE.filter.cat=el.dataset.cat;renderItems();return;}
  if(act==='status-chip'){STATE.filter.status=el.dataset.status;renderItems();return;}
  if(act==='save-item'){saveItem();return;}
  if(act==='del-item'){deleteItem();return;}
  if(act==='add-extra'){addExtra();return;}
  if(act==='del-extra'){delExtra(el.dataset.ex);return;}
  if(act==='add-link'){addLink();return;}
  if(act==='del-link'){delLink(el.dataset.id);return;}
  if(act==='pick-image'){const f=document.getElementById('img-file');if(f)f.click();return;}
  if(act==='remove-image'){removeImage();return;}
  if(act==='retire-item'){retireItem();return;}
  if(act==='reopen-item'){reopenItem();return;}
  if(act==='export-data'){exportData();return;}
  if(act==='import-data'){document.getElementById('import-file').click();return;}
  if(act==='load-sample'){if(confirm('载入示例将替换当前全部数据，确定吗？')){STATE.items=sampleItems();save();toast('已载入示例数据');route();}return;}
  if(act==='clear-all'){if(confirm('确认清空全部物品数据？此操作不可恢复。')){STATE.items=[];save();toast('已清空');route();}return;}
  if(act==='bind-file'){bindDataFile();return;}
  if(act==='unbind-file'){unbindDataFile();return;}
  if(act==='gh-save'){ghSave();return;}
  if(act==='gh-pull'){pullFromGithub();return;}
  if(act==='gh-push'){pushToGithub();return;}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='gh-autopull'){ghUpdateConfig({autoPull:e.target.checked});toast(e.target.checked?'已开启自动拉取':'已关闭自动拉取');}
  if(e.target&&e.target.id==='import-file'){importData(e.target);}
  if(e.target&&e.target.id==='img-file'){handleImageFile(e.target);}
  if(e.target&&e.target.id==='sort-select'){STATE.sort=e.target.value;try{localStorage.setItem('worthit-sort',STATE.sort);}catch(err){}renderItems();}
});

/* ---------- 右键 / 长按菜单 ---------- */
var _touchTimer=null,_touchStart={x:0,y:0,id:null};
function hideCtx(){var m=document.getElementById('ctx-menu');if(m)m.classList.add('hidden');STATE.ctxId=null;}
function openCtxMenu(id,x,y){
  var m=document.getElementById('ctx-menu');if(!m)return;
  m.classList.remove('hidden');
  var w=m.offsetWidth,h=m.offsetHeight;
  var px=Math.min(x,window.innerWidth-w-8),py=Math.min(y,window.innerHeight-h-8);
  if(px<8)px=8;if(py<8)py=8;
  m.style.left=px+'px';m.style.top=py+'px';
  STATE.ctxId=id;
}
document.addEventListener('contextmenu',function(e){
  var row=e.target.closest?e.target.closest('[data-ctx]'):null;
  if(!row)return;
  e.preventDefault();
  openCtxMenu(row.dataset.ctx,e.clientX,e.clientY);
});
document.addEventListener('touchstart',function(e){
  var t=e.changedTouches&&e.changedTouches[0];if(!t)return;
  var row=e.target.closest?e.target.closest('[data-ctx]'):null;
  if(!row)return;
  _touchStart={x:t.clientX,y:t.clientY,id:row.dataset.ctx};
  _touchTimer=setTimeout(function(){
    if(_touchStart.id){
      if(navigator.vibrate)navigator.vibrate(25);
      openCtxMenu(_touchStart.id,_touchStart.x,_touchStart.y);
      STATE.suppressClick=Date.now()+900;
      _touchStart.id=null;
    }
  },550);
},{passive:true});
document.addEventListener('touchmove',function(){if(_touchTimer){clearTimeout(_touchTimer);_touchTimer=null;_touchStart.id=null;}},{passive:true});
document.addEventListener('touchend',function(){if(_touchTimer){clearTimeout(_touchTimer);_touchTimer=null;}});
window.addEventListener('scroll',function(){hideCtx();},true);

/* ---------- 多选 / 删除 ---------- */
function toggleSelect(id){
  if(STATE.selected.has(id))STATE.selected.delete(id);else STATE.selected.add(id);
  renderItems();
}
function selectAllToggle(){
  if(STATE.filteredIds.length&&STATE.selected.size===STATE.filteredIds.length){STATE.selected.clear();}
  else{STATE.filteredIds.forEach(id=>STATE.selected.add(id));}
  renderItems();
}
function cleanupLinks(ids){
  const set=new Set(ids);
  STATE.items.forEach(function(it){
    if(it.links&&it.links.length)it.links=it.links.filter(l=>!set.has(l.id));
  });
}
function batchDelete(){
  const n=STATE.selected.size;if(!n)return;
  if(!confirm('确定删除选中的 '+n+' 件物品？删除后不可恢复。'))return;
  STATE.selected.forEach(id=>{const it=STATE.items.find(i=>i.id===id);if(it&&it.imageKey)imgDel(it.imageKey);});
  STATE.items=STATE.items.filter(i=>!STATE.selected.has(i.id));
  cleanupLinks(Array.from(STATE.selected));
  STATE.selected.clear();save();toast('已删除 '+n+' 件物品');renderItems();
}
function deleteById(id){
  const it=STATE.items.find(i=>i.id===id);if(!it)return;
  if(!confirm('确认删除「'+it.name+'」？删除后不可恢复。'))return;
  if(it.imageKey)imgDel(it.imageKey);
  STATE.items=STATE.items.filter(i=>i.id!==id);
  cleanupLinks([id]);
  if(STATE.itemId===id)STATE.itemId=null;
  save();toast('已删除');
  if(location.hash.indexOf('#/item')===0){go('items');}else{route();}
}
function val(id){const el=document.getElementById(id);return el?el.value.trim():'';}
function removeImage(){
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  const key=it?(it.imageKey||null):STATE.pendingImage;
  if(!key)return;
  if(it){imgDel(key);it.imageKey=null;save();}else{STATE.pendingImage=null;imgDel(key);}
  toast('已移除图片');updateImagePanel(null,null);
}
function updateImagePanel(key,dataURL){
  const panel=document.getElementById('img-panel');
  if(!panel)return;
  const prev=document.getElementById('img-preview');
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  const firstChar=esc(((it&&it.name)||(val('f-name'))||'?').charAt(0));
  if(prev){
    if(dataURL){prev.style.backgroundImage='url("'+dataURL+'")';prev.textContent='';}
    else{prev.style.backgroundImage='';prev.textContent=firstChar;}
  }
  const actions=panel.querySelector('.img-actions');
  if(!actions)return;
  const rm=panel.querySelector('[data-action="remove-image"]');
  if(key&&!rm){
    const b=document.createElement('button');
    b.className='btn ghost';b.setAttribute('data-action','remove-image');b.textContent='移除图片';
    actions.insertBefore(b,actions.querySelector('.hint')||null);
  }else if(!key&&rm){rm.remove();}
}
function handleImageFile(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!/^image\//.test(f.type)){toast('请选择 JPG / PNG 等图片文件');input.value='';return;}
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  compressImage(f,600).then(function(dataURL){
    const key='im'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    imgSave(key,dataURL).then(function(){
      if(it){const old=it.imageKey;it.imageKey=key;save();if(old&&old!==key)imgDel(old);}
      else{STATE.pendingImage=key;}
      toast('图片已保存');updateImagePanel(key,dataURL);
    });
  }).catch(function(){toast('图片处理失败，请换一张试试');});
  input.value='';
}
function saveItem(){
  const name=val('f-name'),date=val('f-date'),price=val('f-price');
  if(!name){toast('请填写物品名称');return;}
  if(!date){toast('请填写购买日期');return;}
  const idx=STATE.items.findIndex(i=>i.id===STATE.itemId);
  const data={name,category:val('f-cat')||'其他',sub:(val('f-sub')||'').trim(),purchaseDate:date,purchasePrice:+price||0,
    lifespanYears:+val('f-life')||1,salvageRate:(+val('f-salvage')||0)/100,warrantyMonths:+val('f-warranty')||0,
    frequency:val('f-freq'),
    notes:val('f-notes'),extras:idx>=0?STATE.items[idx].extras:STATE.pendingExtras,
    imageKey:idx>=0?(STATE.items[idx].imageKey||null):(STATE.pendingImage||null),
    status:'active',retireDate:null,salePrice:null};
  if(idx>=0){STATE.items[idx]=Object.assign({},STATE.items[idx],data);toast('已保存修改');}
  else{
    data.id=uid();data.links=STATE.pendingLinks;
    STATE.items.push(data);
    data.links.forEach(function(l){const t=STATE.items.find(i=>i.id===l.id);if(t){t.links=t.links||[];if(!t.links.some(x=>x.id===data.id))t.links.push({id:data.id,weight:l.weight});}});
    STATE.itemId=data.id;STATE.pendingImage=null;STATE.pendingExtras=[];STATE.pendingLinks=[];
    toast('已加入清单');
  }
  save();route();
}
function extraListHTML(){
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  const list=it?it.extras:STATE.pendingExtras;
  return (list||[]).map(e=>`<div class="extra-row"><span>${esc(e.date)}</span><span>${esc(e.name)}</span><span class="num">${fmtMoney(e.amount)}</span><span class="del" data-action="del-extra" data-ex="${e.id}">删除</span></div>`).join('')||'<div style="color:var(--sub);font-size:12px">暂无附加成本</div>';
}
function linkListHTML(){
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  const d=it||{links:STATE.pendingLinks};
  return (d.links||[]).map(l=>{const t=STATE.items.find(i=>i.id===l.id);return t?`<div class="link-row"><span style="font-weight:600">${esc(t.name)}</span><span class="link-tag ${(+l.weight||1)>=2?'tight':''}">${(+l.weight||1)>=2?'紧密':'普通'}</span><span class="del" data-action="del-link" data-id="${l.id}">删除</span></div>`:'';}).join('')||'<div style="color:var(--sub);font-size:12px">暂无手动关联，可在下方添加</div>';
}
function linkTargetOptionsHTML(){
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  const d=it||{links:STATE.pendingLinks};
  return STATE.items.filter(i=>i.id!==(it?it.id:null)&&!((d.links||[]).some(l=>l.id===i.id))).map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');
}
function refreshSections(){
  const ex=document.querySelector('.extra-list');if(ex)ex.innerHTML=extraListHTML();
  const lk=document.querySelector('.link-list');if(lk)lk.innerHTML=linkListHTML();
  const sel=document.getElementById('link-target');
  if(sel){sel.innerHTML='<option value="">选择要关联的物品…</option>'+linkTargetOptionsHTML();}
}
function addExtra(){
  const date=val('ex-date'),name=val('ex-name'),amount=val('ex-amount');
  if(!name||!amount){toast('请填写名称和金额');return;}
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  if(it){it.extras.push({id:'ex'+Date.now().toString(36),date,name,amount:+amount||0});save();}
  else{STATE.pendingExtras.push({id:'ex'+Date.now().toString(36),date,name,amount:+amount||0});}
  refreshSections();
}
function delExtra(exId){
  if(!confirm('删除这条附加成本记录？'))return;
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  if(it){it.extras=it.extras.filter(e=>e.id!==exId);save();}
  else{STATE.pendingExtras=STATE.pendingExtras.filter(e=>e.id!==exId);}
  refreshSections();
}
function addLink(){
  const targetId=val('link-target');const weight=+val('link-weight')||1;
  if(!targetId){toast('请选择要关联的物品');return;}
  const t=STATE.items.find(i=>i.id===targetId);if(!t)return;
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  if(it){
    it.links=it.links||[];if(!it.links.some(l=>l.id===targetId))it.links.push({id:targetId,weight});
    t.links=t.links||[];if(!t.links.some(l=>l.id===it.id))t.links.push({id:it.id,weight});
    save();
  }else{
    if(!STATE.pendingLinks.some(l=>l.id===targetId))STATE.pendingLinks.push({id:targetId,weight});
  }
  toast('已关联「'+t.name+'」');refreshSections();
}
function delLink(targetId){
  const it=STATE.items.find(i=>i.id===STATE.itemId);
  if(it){
    const t=STATE.items.find(i=>i.id===targetId);
    it.links=(it.links||[]).filter(l=>l.id!==targetId);
    if(t)t.links=(t.links||[]).filter(l=>l.id!==it.id);
    save();
  }else{
    STATE.pendingLinks=STATE.pendingLinks.filter(l=>l.id!==targetId);
  }
  refreshSections();
}
function retireItem(){
  const it=STATE.items.find(i=>i.id===STATE.itemId);if(!it)return;
  const date=val('ret-date'),price=+val('ret-price')||0;
  it.status='retired';it.retireDate=date||fmtDate(today());it.salePrice=price;
  save();toast(price>0?'已登记退役，回血 '+fmtMoney(price):'已登记退役');renderItemDetail();
}
function reopenItem(){
  const it=STATE.items.find(i=>i.id===STATE.itemId);if(!it)return;
  it.status='active';it.retireDate=null;it.salePrice=null;
  save();toast('已恢复在役');renderItemDetail();
}
function deleteItem(){if(STATE.itemId){deleteById(STATE.itemId);}}
function buildExportPayload(){
  const keys=STATE.items.map(i=>i.imageKey).filter(Boolean);
  return Promise.all(keys.map(k=>imgLoad(k))).then(function(datas){
    const images={};keys.forEach((k,i)=>{if(datas[i])images[k]=datas[i];});
    return {app:'worthit-dashboard',v:2,exportedAt:fmtDate(today()),items:STATE.items,images};
  }).catch(function(){return {app:'worthit-dashboard',v:2,exportedAt:fmtDate(today()),items:STATE.items,images:{}};});
}
function exportData(){
  buildExportPayload().then(function(payload){
    const keys=Object.keys(payload.images);
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='worthit-consumption-'+fmtDate(today())+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('已导出 JSON'+(keys.length?'（含 '+keys.length+' 张图片）':''));
  });
}
function applyImportedData(d,after){
  try{
    const items=Array.isArray(d)?d:(d.items||[]);
    if(!items.every(x=>x.name&&x.purchaseDate))throw new Error('bad');
    const images=d.images||{};
    const keys=Object.keys(images);
    const apply=function(okImg){STATE.items=items;save();if(after)after(okImg,items.length,keys.length);};
    if(keys.length){
      Promise.all(keys.map(k=>imgSave(k,images[k]))).then(function(){apply(true);}).catch(function(){apply(false);});
    }else{apply(false);}
    return true;
  }catch(err){return false;}
}
function importData(input){
  const f=input.files&&input.files[0];if(!f)return;
  const reader=new FileReader();
  reader.onload=function(){
    let d;try{d=JSON.parse(reader.result);}catch(err){toast('导入失败：文件格式不正确');input.value='';return;}
    const ok=applyImportedData(d,function(okImg,n,imgN){
      toast('已导入 '+n+' 件物品'+(okImg&&imgN?'（含 '+imgN+' 张图片）':''));route();
    });
    if(!ok)toast('导入失败：文件格式不正确');
    input.value='';
  };
  reader.readAsText(f);
}
/* ---------- GitHub 云同步（手机 ⇄ 电脑 数据中转） ---------- */
const GH_FILE='worthit-data.json';
const GH_CFG_KEY='worthit-gh';
function ghConfig(){try{const c=JSON.parse(localStorage.getItem(GH_CFG_KEY)||'null');if(c&&c.owner&&c.repo&&c.token)return c;}catch(e){}return null;}
function ghSaveConfig(owner,repo,token){const cfg={owner:owner.trim(),repo:repo.trim(),token:token.trim(),autoPull:false,syncedAt:null};try{localStorage.setItem(GH_CFG_KEY,JSON.stringify(cfg));}catch(e){}return cfg;}
function ghUpdateConfig(patch){const c=ghConfig()||{};Object.assign(c,patch);try{localStorage.setItem(GH_CFG_KEY,JSON.stringify(c));}catch(e){}}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s)));}
function ghUrl(cfg){return 'https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+GH_FILE;}
function ghHeaders(cfg){return {'Authorization':'token '+cfg.token,'Accept':'application/vnd.github+json'};}
function ghGetFile(cfg){
  return fetch(ghUrl(cfg),{headers:ghHeaders(cfg)}).then(function(r){
    if(r.status===404)return null;
    if(!r.ok)return r.json().then(function(j){throw new Error(j.message||('HTTP '+r.status));});
    return r.json();
  });
}
function ghPutFile(cfg,content,sha){
  return fetch(ghUrl(cfg),{method:'PUT',headers:ghHeaders(cfg),body:JSON.stringify({message:'WorthIt 云同步',content:b64enc(content),sha:sha||undefined})}).then(function(r){
    if(!r.ok)return r.json().then(function(j){throw new Error(j.message||('HTTP '+r.status));});
    return r.json();
  });
}
function ghSave(){
  const owner=val('gh-owner'),repo=val('gh-repo'),token=val('gh-token');
  if(!owner||!repo||!token){toast('请填写 GitHub 用户名、仓库名和 Token');return;}
  ghSaveConfig(owner,repo,token);
  toast('已保存 GitHub 同步配置');renderData();
}
function pullFromGithub(){
  const cfg=ghConfig();if(!cfg){toast('请先保存 GitHub 同步配置');return;}
  ghGetFile(cfg).then(function(meta){
    if(!meta){toast('云端还没有数据文件，请先在本机推送一次');return;}
    let d;try{d=JSON.parse(b64dec(meta.content));}catch(err){toast('云端数据解析失败');return;}
    const n0=STATE.items.length;
    if(n0&&!confirm('从云端拉取将覆盖本机当前 '+n0+' 件物品，确定吗？'))return;
    const ok=applyImportedData(d,function(okImg,n){
      ghUpdateConfig({syncedAt:Date.now()});
      toast('已从云端拉取 '+n+' 件物品'+(okImg?'（含图片）':''));renderData();
    });
    if(!ok)toast('云端数据格式不正确');
  }).catch(function(e){toast('拉取失败：'+(e.message||e));});
}
function pushToGithub(){
  const cfg=ghConfig();if(!cfg){toast('请先保存 GitHub 同步配置');return;}
  if(!confirm('将本机 '+STATE.items.length+' 件物品推送到 GitHub 仓库，覆盖云端数据，确定吗？'))return;
  ghGetFile(cfg).then(function(meta){
    const sha=meta?meta.sha:null;
    return buildExportPayload().then(function(payload){return ghPutFile(cfg,JSON.stringify(payload,null,2),sha);});
  }).then(function(){
    ghUpdateConfig({syncedAt:Date.now()});
    toast('已推送到 GitHub，其他设备拉取即可同步');renderData();
  }).catch(function(e){toast('推送失败：'+(e.message||e));});
}
function maybeAutoPull(){
  const c=ghConfig();if(!c||!c.autoPull)return;
  ghGetFile(c).then(function(meta){
    if(!meta)return;
    let d;try{d=JSON.parse(b64dec(meta.content));}catch(err){return;}
    if(!d.items||!d.items.length)return;
    const same=d.items.length===STATE.items.length&&d.items.every((x,i)=>x.id===STATE.items[i].id&&x.name===STATE.items[i].name&&x.purchasePrice===STATE.items[i].purchasePrice);
    if(same)return;
    const ok=applyImportedData(d,function(okImg,n){toast('已自动从云端同步 '+n+' 件物品');route();});
    if(!ok)toast('自动同步失败：云端数据格式不正确');
  }).catch(function(){});
}
window.addEventListener('resize',function(){Object.keys(STATE.charts).forEach(k=>STATE.charts[k]&&STATE.charts[k].resize());});

/* ---------- 启动 ---------- */
loadAll();
window.addEventListener('hashchange',route);

</script>
